plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'uz.topdim'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:junit-jupiter'
        testImplementation 'org.testcontainers:postgresql'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Testcontainers 1.20 falls back to obsolete Docker API 1.32 when the
        // Gradle test worker does not inherit a client version. Docker Desktop
        // used by the project requires at least 1.40.
        def dockerApiVersion = System.getProperty('api.version')
                ?: System.getenv('DOCKER_API_VERSION')
                ?: '1.40'
        environment 'DOCKER_API_VERSION', dockerApiVersion
        systemProperty 'api.version', dockerApiVersion
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        '**/*Dto*',
                        '**/*Request*',
                        '**/*Response*',
                        '**/*Entity*',
                        '**/entity/**',
                        '**/dto/**',
                        '**/config/**',
                        '**/exception/**'
                ])
            }))
        }
        finalizedBy jacocoTestCoverageVerification
    }

    jacocoTestCoverageVerification {
        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        '**/*Dto*',
                        '**/*Request*',
                        '**/*Response*',
                        '**/*Entity*',
                        '**/entity/**',
                        '**/dto/**',
                        '**/config/**',
                        '**/exception/**'
                ])
            }))
        }
        violationRules {
            rule {
                limit {
                    minimum = 0.10
                }
            }
        }
    }
}
