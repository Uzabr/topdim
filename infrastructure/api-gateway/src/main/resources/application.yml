server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # Auth Service — login (строгий rate limit: 2 req/sec, burst 3)
        - id: auth-login
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/login
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 3
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false

        # Auth Service — register (строже: 1 req/sec, burst 2)
        - id: auth-register
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/register
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false

        # Identity Service — остальные endpoints (refresh, logout, change-password, super admin)
        - id: identity-service-auth
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/super/**

        # Identity Service — заявки партнёров (публичный, без JWT)
        - id: identity-service-partner-applications
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/partners/applications
            - Method=POST

        # Identity Service — users, admin, partner staff
        - id: identity-service-users
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/admin/users/**, /api/v1/partner/staff/**, /api/v1/admin/partner-applications/**

        # Coupon Service — bot webhook (approve/reject, защищён X-Bot-Api-Key)
        - id: coupon-service-bot
          uri: lb://coupon-service
          predicates:
            - Path=/api/v1/bot/**

        # Coupon Service
        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/v1/coupons/**, /api/v1/categories/**, /api/v1/situations/**, /api/v1/merchants/**, /api/v1/admin/coupons/**, /api/v1/admin/merchants/**, /api/v1/admin/categories/**, /api/v1/admin/situations/**, /api/v1/partner/coupons/**, /api/v1/partner/merchant/**, /api/v1/mod/coupons/**, /api/v1/mod/reviews/**, /api/v1/mod/questions/**, /api/v1/reviews/**, /api/v1/questions/**, /api/v1/admin/promocodes/**

        # Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/cart/**, /api/v1/orders/**, /api/v1/admin/orders/**, /api/v1/partner/stats, /api/v1/partner/dashboard, /api/v1/partner/redemptions/**, /api/v1/complaints/**, /api/v1/mod/complaints/**, /api/v1/refunds/**, /api/v1/admin/refunds/**

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

        # Bazaar Service
        - id: bazaar-service
          uri: lb://bazaar-service
          predicates:
            - Path=/api/v1/bazaars/**, /api/v1/shops/**, /api/v1/admin/bazaars/**, /api/v1/admin/shops/**, /api/v1/partner/shops/**

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        # Media Service
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**

        # Discovery Server UI
        - id: discovery-server
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/web
          filters:
            - SetPath=/

        # Discovery Server Static Resources
        - id: discovery-server-static
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-do-not-use-in-production-32chars}

# CORS — типобезопасная конфигурация через @ConfigurationProperties
app:
  cors:
    allowed-origins:
      - ${CORS_ORIGIN_1:http://localhost:3001}
      - ${CORS_ORIGIN_2:http://localhost:5173}
      - ${CORS_ORIGIN_3:http://localhost:3002}
    allow-credentials: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        # M2: gateway actuator доступен без JWT → только health наружу.
        # prometheus/metrics оставлены в downstream-сервисах для внутреннего Prometheus.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
