name: Secret scan (gitleaks)

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists PR commits via the GitHub API

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for personal accounts / public repos.
          # (A GITLEAKS_LICENSE secret is only required for GitHub Organizations.)
