name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web-app: ${{ steps.filter.outputs.web-app }}
      admin-app: ${{ steps.filter.outputs.admin-app }}
      partner: ${{ steps.filter.outputs.partner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'infrastructure/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
            frontend:
              - 'frontend/**'
            web-app:
              - 'frontend/web-app/**'
            admin-app:
              - 'frontend/admin-app/**'
            partner:
              - 'frontend/partner/**'

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Remove local JDK path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/**'
          retention-days: 7

  frontend:
    name: Frontend (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: web-app
            app_path: frontend/web-app
            changed: ${{ needs.changes.outputs.web-app }}
          - app_name: admin-app
            app_path: frontend/admin-app
            changed: ${{ needs.changes.outputs.admin-app }}
          - app_name: partner
            app_path: frontend/partner
            changed: ${{ needs.changes.outputs.partner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app_path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app_path }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app_path }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.app_path }}
        run: npm run build
