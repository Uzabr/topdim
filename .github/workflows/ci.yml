name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web-app: ${{ steps.filter.outputs.web-app }}
      admin-app: ${{ steps.filter.outputs.admin-app }}
      partner: ${{ steps.filter.outputs.partner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'infrastructure/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
            frontend:
              - 'frontend/**'
            web-app:
              - 'frontend/web-app/**'
            admin-app:
              - 'frontend/admin-app/**'
            partner:
              - 'frontend/partner/**'

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove local JDK path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/**'
          retention-days: 7

  frontend:
    name: Frontend (${{ matrix.app_name }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}

    strategy:
      matrix:
        include:
          - app_name: web-app
            app_path: frontend/web-app
            changed: ${{ needs.changes.outputs.web-app }}
          - app_name: admin-app
            app_path: frontend/admin-app
            changed: ${{ needs.changes.outputs.admin-app }}
          - app_name: partner
            app_path: frontend/partner
            changed: ${{ needs.changes.outputs.partner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app_path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app_path }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app_path }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.app_path }}
        run: npm run build

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
