name: CD — build & push images

# Сборка: авто при мерже в main → образы в GHCR (:latest + :sha-<commit>). CI валидирует каждый мерж.
# Деплой: ТОЛЬКО вручную через workflow_dispatch (Actions → Run workflow), НЕ на push.
#   Так «неправильный мерж» не уезжает в прод сам — прод обновляется только по явному запуску.
#   Перед вызовом EasyPanel-вебхуков deploy-job проверяет вердикт PR-гейта и блокируется на FAIL.
# Канал: EasyPanel deploy-webhook (SSH forced-command на сервер, порт 3000 закрыт снаружи).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Сервисы для деплоя через пробел (пусто = все 11)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/uzabr/topdim

jobs:
  build-backend:
    name: Build backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: discovery-server
            module_path: infrastructure:discovery-server
          - service: api-gateway
            module_path: infrastructure:api-gateway
          - service: identity-service
            module_path: services:identity-service
          - service: coupon-service
            module_path: services:coupon-service
          - service: order-service
            module_path: services:order-service
          - service: payment-service
            module_path: services:payment-service
          - service: notification-service
            module_path: services:notification-service
          - service: media-service
            module_path: services:media-service

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-app
            app_path: frontend/web-app
            api_url: https://api.sizbiz.uz
          - service: admin-app
            app_path: frontend/admin-app
            api_url: https://api.sizbiz.uz
          - service: partner
            app_path: frontend/partner
            api_url: https://api.sizbiz.uz

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            APP_PATH=${{ matrix.app_path }}
            VITE_API_URL=${{ matrix.api_url }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  detect-deploy:
    name: Detect services to deploy
    runs-on: ubuntu-latest
    # Только ручной запуск: на push деплой не идёт (прод обновляем осознанно).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      services: ${{ steps.assemble.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Path filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            backend_shared:
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'docker/backend/**'
            frontend_shared:
              - 'docker/frontend/**'
            discovery-server:
              - 'infrastructure/discovery-server/**'
            api-gateway:
              - 'infrastructure/api-gateway/**'
            identity-service:
              - 'services/identity-service/**'
            coupon-service:
              - 'services/coupon-service/**'
            order-service:
              - 'services/order-service/**'
            payment-service:
              - 'services/payment-service/**'
            notification-service:
              - 'services/notification-service/**'
            media-service:
              - 'services/media-service/**'
            web-app:
              - 'frontend/web-app/**'
            admin-app:
              - 'frontend/admin-app/**'
            partner:
              - 'frontend/partner/**'

      - name: Assemble deploy list
        id: assemble
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SERVICES: ${{ github.event.inputs.services }}
          F_BACKEND_SHARED: ${{ steps.filter.outputs.backend_shared }}
          F_FRONTEND_SHARED: ${{ steps.filter.outputs.frontend_shared }}
          F_DISCOVERY: ${{ steps.filter.outputs.discovery-server }}
          F_GATEWAY: ${{ steps.filter.outputs.api-gateway }}
          F_IDENTITY: ${{ steps.filter.outputs.identity-service }}
          F_COUPON: ${{ steps.filter.outputs.coupon-service }}
          F_ORDER: ${{ steps.filter.outputs.order-service }}
          F_PAYMENT: ${{ steps.filter.outputs.payment-service }}
          F_NOTIFICATION: ${{ steps.filter.outputs.notification-service }}
          F_MEDIA: ${{ steps.filter.outputs.media-service }}
          F_WEB: ${{ steps.filter.outputs.web-app }}
          F_ADMIN: ${{ steps.filter.outputs.admin-app }}
          F_PARTNER: ${{ steps.filter.outputs.partner }}
        run: |
          set -euo pipefail
          # Deterministic deploy order: backend (discovery→gateway→rest) then frontend.
          BACKEND="discovery-server api-gateway identity-service coupon-service order-service payment-service notification-service media-service"
          FRONTEND="web-app admin-app partner"
          declare -A want=()
          add() { local s; for s in $1; do want["$s"]=1; done; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "${DISPATCH_SERVICES:-}" ]; then
              add "$DISPATCH_SERVICES"          # invalid names get dropped by the ORDER filter below
            else
              add "$BACKEND"; add "$FRONTEND"   # empty input = deploy everything
            fi
          else
            # push: deploy only what changed; shared code fans out to the whole tier.
            [ "$F_BACKEND_SHARED" = "true" ]  && add "$BACKEND"
            [ "$F_FRONTEND_SHARED" = "true" ] && add "$FRONTEND"
            [ "$F_DISCOVERY" = "true" ]     && add "discovery-server"
            [ "$F_GATEWAY" = "true" ]       && add "api-gateway"
            [ "$F_IDENTITY" = "true" ]      && add "identity-service"
            [ "$F_COUPON" = "true" ]        && add "coupon-service"
            [ "$F_ORDER" = "true" ]         && add "order-service"
            [ "$F_PAYMENT" = "true" ]       && add "payment-service"
            [ "$F_NOTIFICATION" = "true" ]  && add "notification-service"
            [ "$F_MEDIA" = "true" ]         && add "media-service"
            [ "$F_WEB" = "true" ]           && add "web-app"
            [ "$F_ADMIN" = "true" ]         && add "admin-app"
            [ "$F_PARTNER" = "true" ]       && add "partner"
          fi

          OUT=""
          for s in $BACKEND $FRONTEND; do
            [ "${want[$s]:-}" = "1" ] && OUT="$OUT $s"
          done
          OUT="$(echo "$OUT" | xargs || true)"
          echo "services=$OUT" >> "$GITHUB_OUTPUT"
          echo "Deploy set: '${OUT:-<empty — nothing to deploy>}'"

  deploy:
    name: Deploy changed services (EasyPanel webhooks)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, detect-deploy]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.detect-deploy.outputs.services != '' }}
    permissions:
      contents: read
      pull-requests: read   # guard читает вердикт PR-гейта
    steps:
      - name: Verify PR gate verdict (block on explicit FAIL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Мягкий guard: деплой блокируется ТОЛЬКО при явном FAIL-вердикте PR-гейта
          # у PR, из которого пришёл этот коммит main. Нет вердикта (гейт ещё не активен
          # или прямой push) → деплой разрешён с предупреждением, чтобы не забетонировать
          # доставку до активации гейта #78. Ужесточить (нет PASS → стоп) можно позже.
          set +e
          pr=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
                 -H "Accept: application/vnd.github+json" --jq '.[0].number' 2>/dev/null)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "::warning::Не нашёл PR для коммита ${SHA} — деплой без проверки вердикта гейта."
            exit 0
          fi
          verdict=$(gh pr view "$pr" --repo "$REPO" --json comments \
            --jq '[.comments[] | select(.author.login | endswith("[bot]")) | select(.body | test("## Вердикт:"))] | last | .body // ""' 2>/dev/null)
          if printf '%s' "$verdict" | grep -q "## Вердикт: FAIL"; then
            echo "::error::PR #${pr}: вердикт гейта FAIL — деплой заблокирован. Разберись перед деплоем."
            exit 1
          fi
          if printf '%s' "$verdict" | grep -q "## Вердикт: PASS"; then
            echo "PR #${pr}: вердикт гейта PASS — продолжаю."
          else
            echo "::warning::PR #${pr}: вердикта гейта нет — деплой без подтверждения (гейт #78 ещё не активен?)."
          fi
          exit 0

      - name: Trigger deploy over SSH (forced command)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SERVICES: ${{ needs.detect-deploy.outputs.services }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ] || [ -z "${KNOWN_HOSTS:-}" ]; then
            echo "::error::deploy secrets not configured (DEPLOY_SSH_KEY/HOST/KNOWN_HOSTS)"; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          echo "Deploying: $SERVICES"
          # The server's forced command runs /home/deploy/deploy.sh; "$SERVICES" arrives
          # as $SSH_ORIGINAL_COMMAND. StrictHostKeyChecking=yes + pinned known_hosts → no MITM.
          ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              -p "${SSH_PORT:-49222}" "$SSH_USER@$SSH_HOST" "$SERVICES"

      - name: Wipe SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  notify-deploy:
    name: Telegram notify (deploy)
    runs-on: ubuntu-latest
    needs: [detect-deploy, deploy]
    if: ${{ always() && needs.detect-deploy.outputs.services != '' && needs.deploy.result != 'skipped' }}
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVICES: ${{ needs.detect-deploy.outputs.services }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured, skipping"; exit 0
          fi
          if [ "$DEPLOY_RESULT" = "success" ]; then
            EMOJI="🚀"; STATUS="деплой успешен"
          else
            EMOJI="❌"; STATUS="ошибка деплоя (${DEPLOY_RESULT})"
          fi
          SHA_SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          WHEN="$(date -u '+%Y-%m-%d %H:%M UTC')"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="$(printf '%s topdim — %s\n\n📦 сервисы: %s\n🔖 %s\n🕐 %s\n\n🔗 %s' \
            "$EMOJI" "$STATUS" "$SERVICES" "$SHA_SHORT" "$WHEN" "$RUN_URL")"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d disable_web_page_preview=true || true

  notify:
    name: Telegram notify (build)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()

    steps:
      - name: Checkout (for commit subject)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured, skipping"
            exit 0
          fi

          if [ "${{ needs.build-backend.result }}" = "success" ] && [ "${{ needs.build-frontend.result }}" = "success" ]; then
            EMOJI="✅"; STATUS="образы собраны и запушены в GHCR (:latest + :sha)"
          else
            EMOJI="❌"; STATUS="ошибка сборки образов"
          fi

          SHA_SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          MSG="$(git log -1 --pretty=%s 2>/dev/null || echo '')"
          WHEN="$(date -u '+%Y-%m-%d %H:%M UTC')"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="$(printf '%s Сборка topdim — %s\n\n📦 %s — %s\n👤 %s · ветка %s\n🕐 %s\n\n🔗 %s' \
            "$EMOJI" "$STATUS" "$SHA_SHORT" "$MSG" "${{ github.actor }}" "${{ github.ref_name }}" "$WHEN" "$RUN_URL")"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d disable_web_page_preview=true || true
