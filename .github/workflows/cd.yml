name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/uzabr/topdim

jobs:
  build-backend:
    name: Build backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: discovery-server
            module_path: infrastructure:discovery-server
          - service: config-server
            module_path: infrastructure:config-server
          - service: api-gateway
            module_path: infrastructure:api-gateway
          - service: identity-service
            module_path: services:identity-service
          - service: coupon-service
            module_path: services:coupon-service
          - service: order-service
            module_path: services:order-service
          - service: payment-service
            module_path: services:payment-service
          - service: bazaar-service
            module_path: services:bazaar-service
          - service: notification-service
            module_path: services:notification-service
          - service: media-service
            module_path: services:media-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: web-app
            app_path: frontend/web-app
            api_url: https://api.sizbiz.uz
          - service: admin-app
            app_path: frontend/admin-app
            api_url: https://api.sizbiz.uz
          - service: partner
            app_path: frontend/partner
            api_url: https://api.sizbiz.uz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            APP_PATH=${{ matrix.app_path }}
            VITE_API_URL=${{ matrix.api_url }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT
          script: |
            REGISTRY="ghcr.io/uzabr/topdim"

            echo "$GHCR_PAT" | docker login ghcr.io -u uzabr --password-stdin

            for svc in discovery-server config-server api-gateway \
                       identity-service coupon-service order-service \
                       payment-service bazaar-service notification-service media-service \
                       web-app admin-app partner; do
              echo "Updating topdim_${svc}..."
              docker service update --image "${REGISTRY}/${svc}:latest" \
                "topdim_${svc}" --with-registry-auth --detach \
                && echo "  OK: ${svc}" || echo "  SKIP: ${svc} (not found)"
            done

            docker logout ghcr.io
