name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/uzabr/topdim

jobs:
  build-backend:
    name: Build backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: discovery-server
            module_path: infrastructure:discovery-server
          - service: api-gateway
            module_path: infrastructure:api-gateway
          - service: identity-service
            module_path: services:identity-service
          - service: coupon-service
            module_path: services:coupon-service
          - service: order-service
            module_path: services:order-service
          - service: payment-service
            module_path: services:payment-service
          - service: notification-service
            module_path: services:notification-service
          - service: media-service
            module_path: services:media-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-app
            app_path: frontend/web-app
            api_url: https://api.sizbiz.uz
          - service: admin-app
            app_path: frontend/admin-app
            api_url: https://api.sizbiz.uz
          - service: partner
            app_path: frontend/partner
            api_url: https://api.sizbiz.uz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            APP_PATH=${{ matrix.app_path }}
            VITE_API_URL=${{ matrix.api_url }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Deploy with health check and rollback
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,COMMIT_SHA
          command_timeout: 10m
          script: |
            REGISTRY="ghcr.io/uzabr/topdim"
            DEPLOYED=""
            FAILED=""
            ROLLED_BACK=""

            echo "$GHCR_PAT" | docker login ghcr.io -u uzabr --password-stdin

            for svc in discovery-server api-gateway \
                       identity-service coupon-service order-service \
                       payment-service notification-service media-service \
                       web-app admin-app partner; do

              SVC_NAME="topdim_${svc}"
              echo "========================================="
              echo "Deploying ${svc}..."

              # Save current image for rollback
              OLD_IMAGE=$(docker service inspect "$SVC_NAME" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || echo "")
              if [ -z "$OLD_IMAGE" ]; then
                echo "  SKIP: ${svc} (service not found)"
                continue
              fi

              # Update to new image
              docker service update --image "${REGISTRY}/${svc}:sha-${COMMIT_SHA}" \
                "$SVC_NAME" --with-registry-auth --detach

              # Wait up to 120s for service to stabilize
              HEALTHY=false
              for i in $(seq 1 12); do
                sleep 10
                REPLICAS=$(docker service ls --filter "name=${SVC_NAME}" --format '{{.Replicas}}')
                DESIRED=$(echo "$REPLICAS" | cut -d/ -f2)
                RUNNING=$(echo "$REPLICAS" | cut -d/ -f1)
                echo "  Check $i/12: ${RUNNING}/${DESIRED}"
                if [ "$DESIRED" != "0" ] && [ "$RUNNING" = "$DESIRED" ]; then
                  HEALTHY=true
                  break
                fi
              done

              if [ "$HEALTHY" = true ]; then
                echo "  ✓ ${svc}"
                DEPLOYED="${DEPLOYED} ${svc}"
              else
                echo "  ✗ ${svc} — rolling back..."
                docker service update --image "$OLD_IMAGE" "$SVC_NAME" --with-registry-auth --detach
                ROLLED_BACK="${ROLLED_BACK} ${svc}"
              fi
            done

            docker logout ghcr.io

            echo ""
            echo "========================================="
            echo "DEPLOY SUMMARY (sha: ${COMMIT_SHA:0:7})"
            echo "========================================="
            [ -n "$DEPLOYED" ]    && echo "✓ Deployed:    $DEPLOYED"
            [ -n "$ROLLED_BACK" ] && echo "✗ Rolled back: $ROLLED_BACK"
            [ -z "$DEPLOYED" ] && [ -z "$ROLLED_BACK" ] && echo "Nothing to deploy"

            # Smoke test
            echo ""
            echo "SMOKE TEST"
            for ep in "/api/v1/categories" "/api/v1/coupons?size=1"; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://topdim_api-gateway:8080${ep}" 2>/dev/null || echo "000")
              echo "  GET ${ep} → ${CODE}"
            done

            # Fail if anything rolled back
            [ -n "$ROLLED_BACK" ] && exit 1
            exit 0

  notify:
    name: Telegram notify
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, deploy]
    if: always()

    steps:
      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Skip if Telegram not configured
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured, skipping"
            exit 0
          fi

          if [ "${{ needs.deploy.result }}" = "success" ]; then
            EMOJI="✅"; STATUS="успешно"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            EMOJI="⏭️"; STATUS="пропущен"
          else
            EMOJI="❌"; STATUS="ошибка"
          fi

          SHA="${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="${EMOJI} *Deploy ${STATUS}*
          📦 \`${SHA:0:7}\`
          🔗 [Подробнее](${RUN_URL})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true \
            -d text="${TEXT}" || true
