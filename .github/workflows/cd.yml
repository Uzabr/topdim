name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/uzabr/topdim

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      backend_services: ${{ steps.detect.outputs.backend_services }}
      frontend_services: ${{ steps.detect.outputs.frontend_services }}
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo ".")

          BACKEND_SERVICES="[]"
          FRONTEND_SERVICES="[]"

          # If shared code or gradle config changed — rebuild all backend
          if echo "$CHANGED" | grep -qE '^(shared/|build\.gradle|settings\.gradle|gradle\.properties|docker/backend/)'; then
            BACKEND_SERVICES='[{"service":"discovery-server","module_path":"infrastructure:discovery-server"},{"service":"api-gateway","module_path":"infrastructure:api-gateway"},{"service":"identity-service","module_path":"services:identity-service"},{"service":"coupon-service","module_path":"services:coupon-service"},{"service":"order-service","module_path":"services:order-service"},{"service":"payment-service","module_path":"services:payment-service"},{"service":"notification-service","module_path":"services:notification-service"},{"service":"media-service","module_path":"services:media-service"}]'
          else
            SERVICES=""
            echo "$CHANGED" | grep -q '^infrastructure/discovery-server/' && SERVICES="$SERVICES"'{"service":"discovery-server","module_path":"infrastructure:discovery-server"},'
            echo "$CHANGED" | grep -q '^infrastructure/api-gateway/' && SERVICES="$SERVICES"'{"service":"api-gateway","module_path":"infrastructure:api-gateway"},'
            echo "$CHANGED" | grep -q '^services/identity-service/' && SERVICES="$SERVICES"'{"service":"identity-service","module_path":"services:identity-service"},'
            echo "$CHANGED" | grep -q '^services/coupon-service/' && SERVICES="$SERVICES"'{"service":"coupon-service","module_path":"services:coupon-service"},'
            echo "$CHANGED" | grep -q '^services/order-service/' && SERVICES="$SERVICES"'{"service":"order-service","module_path":"services:order-service"},'
            echo "$CHANGED" | grep -q '^services/payment-service/' && SERVICES="$SERVICES"'{"service":"payment-service","module_path":"services:payment-service"},'
            echo "$CHANGED" | grep -q '^services/notification-service/' && SERVICES="$SERVICES"'{"service":"notification-service","module_path":"services:notification-service"},'
            echo "$CHANGED" | grep -q '^services/media-service/' && SERVICES="$SERVICES"'{"service":"media-service","module_path":"services:media-service"},'
            if [ -n "$SERVICES" ]; then
              BACKEND_SERVICES="[${SERVICES%,}]"
            fi
          fi

          # Frontend detection
          F_SERVICES=""
          if echo "$CHANGED" | grep -qE '^(docker/frontend/|frontend/web-app/)'; then
            F_SERVICES="$F_SERVICES"'{"service":"web-app","app_path":"frontend/web-app","api_url":"https://api.sizbiz.uz"},'
          fi
          if echo "$CHANGED" | grep -qE '^(docker/frontend/|frontend/admin-app/)'; then
            F_SERVICES="$F_SERVICES"'{"service":"admin-app","app_path":"frontend/admin-app","api_url":"https://api.sizbiz.uz"},'
          fi
          if echo "$CHANGED" | grep -qE '^(docker/frontend/|frontend/partner/)'; then
            F_SERVICES="$F_SERVICES"'{"service":"partner","app_path":"frontend/partner","api_url":"https://api.sizbiz.uz"},'
          fi
          if [ -n "$F_SERVICES" ]; then
            FRONTEND_SERVICES="[${F_SERVICES%,}]"
          fi

          echo "backend_services=$BACKEND_SERVICES" >> "$GITHUB_OUTPUT"
          echo "frontend_services=$FRONTEND_SERVICES" >> "$GITHUB_OUTPUT"
          echo "has_backend=$( [ "$BACKEND_SERVICES" != "[]" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "has_frontend=$( [ "$FRONTEND_SERVICES" != "[]" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

          echo "### Changed services" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: $BACKEND_SERVICES" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $FRONTEND_SERVICES" >> "$GITHUB_STEP_SUMMARY"

  build-backend:
    name: Build backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.has_backend == 'true' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.backend_services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.has_frontend == 'true' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.frontend_services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            APP_PATH=${{ matrix.app_path }}
            VITE_API_URL=${{ matrix.api_url }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [ changes, build-backend, build-frontend ]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.changes.outputs.has_backend == 'true' || needs.changes.outputs.has_frontend == 'true')

    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          BACKEND_SERVICES: ${{ needs.changes.outputs.has_backend == 'true' && needs.changes.outputs.backend_services || '[]' }}
          FRONTEND_SERVICES: ${{ needs.changes.outputs.has_frontend == 'true' && needs.changes.outputs.frontend_services || '[]' }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,BACKEND_SERVICES,FRONTEND_SERVICES,COMMIT_SHA
          command_timeout: 10m
          script: |
            REGISTRY="ghcr.io/uzabr/topdim"
            DEPLOYED=""
            FAILED=""
            ROLLED_BACK=""

            echo "$GHCR_PAT" | docker login ghcr.io -u uzabr --password-stdin

            # Extract service names from JSON arrays
            SERVICES=$(echo "$BACKEND_SERVICES $FRONTEND_SERVICES" | grep -oP '"service"\s*:\s*"\K[^"]+' | sort -u)

            if [ -z "$SERVICES" ]; then
              echo "No services to deploy"
              exit 0
            fi

            for svc in $SERVICES; do
              SVC_NAME="topdim_${svc}"
              echo "========================================="
              echo "Deploying ${svc}..."

              # Save current image for rollback
              OLD_IMAGE=$(docker service inspect "$SVC_NAME" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || echo "")

              # Update to new image
              if ! docker service update --image "${REGISTRY}/${svc}:sha-${COMMIT_SHA}" \
                "$SVC_NAME" --with-registry-auth --detach 2>/dev/null; then
                echo "  SKIP: ${svc} (service not found)"
                continue
              fi

              echo "  Image updated, waiting for health..."

              # Wait up to 120s for the service to stabilize
              HEALTHY=false
              for i in $(seq 1 12); do
                sleep 10
                REPLICAS=$(docker service ls --filter "name=${SVC_NAME}" --format '{{.Replicas}}' 2>/dev/null)
                DESIRED=$(echo "$REPLICAS" | cut -d/ -f2)
                RUNNING=$(echo "$REPLICAS" | cut -d/ -f1)
                echo "  Check $i: ${RUNNING}/${DESIRED}"
                if [ "$DESIRED" != "0" ] && [ "$RUNNING" = "$DESIRED" ]; then
                  HEALTHY=true
                  break
                fi
              done

              if [ "$HEALTHY" = true ]; then
                echo "  OK: ${svc} deployed successfully"
                DEPLOYED="${DEPLOYED} ${svc}"
              else
                echo "  FAIL: ${svc} not healthy, rolling back..."
                if [ -n "$OLD_IMAGE" ]; then
                  docker service update --image "$OLD_IMAGE" "$SVC_NAME" --with-registry-auth --detach 2>/dev/null
                  ROLLED_BACK="${ROLLED_BACK} ${svc}"
                else
                  FAILED="${FAILED} ${svc}"
                fi
              fi
            done

            docker logout ghcr.io

            echo ""
            echo "========================================="
            echo "DEPLOY SUMMARY"
            echo "========================================="
            [ -n "$DEPLOYED" ] && echo "Deployed:    $DEPLOYED"
            [ -n "$ROLLED_BACK" ] && echo "Rolled back: $ROLLED_BACK"
            [ -n "$FAILED" ] && echo "Failed:      $FAILED"

            # Smoke test: check key endpoints
            echo ""
            echo "SMOKE TEST"
            for endpoint in "/api/v1/categories" "/api/v1/coupons?size=1"; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://topdim_api-gateway:8080${endpoint}" 2>/dev/null || echo "000")
              echo "  GET ${endpoint} -> ${STATUS}"
            done

            # Exit with error if anything was rolled back
            if [ -n "$ROLLED_BACK" ] || [ -n "$FAILED" ]; then
              exit 1
            fi

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [ changes, build-backend, build-frontend, deploy ]
    if: always() && (needs.changes.outputs.has_backend == 'true' || needs.changes.outputs.has_frontend == 'true')

    steps:
      - name: Send Telegram notification
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            EMOJI="✅"
            STATUS="успешно"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            EMOJI="⏭️"
            STATUS="пропущен (нет изменений)"
          else
            EMOJI="❌"
            STATUS="ошибка"
          fi

          COMMIT_MSG=$(echo "${{ github.event.workflow_run.head_commit.message }}" | head -1)
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          TEXT="${EMOJI} *Deploy ${STATUS}*

          📦 \`${SHORT_SHA}\` ${COMMIT_MSG}
          🔗 [Подробнее](${RUN_URL})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true \
            -d text="${TEXT}" || true
