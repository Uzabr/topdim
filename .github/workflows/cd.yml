name: CD — build & push images

# Фаза 2: авто-сборка при мерже в main → образы в GHCR (:latest + :sha-<commit>).
# Deploy вынесен отдельно (Фаза 3 — EasyPanel webhook + пред-деплой бэкап).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/uzabr/topdim

jobs:
  build-backend:
    name: Build backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: discovery-server
            module_path: infrastructure:discovery-server
          - service: api-gateway
            module_path: infrastructure:api-gateway
          - service: identity-service
            module_path: services:identity-service
          - service: coupon-service
            module_path: services:coupon-service
          - service: order-service
            module_path: services:order-service
          - service: payment-service
            module_path: services:payment-service
          - service: notification-service
            module_path: services:notification-service
          - service: media-service
            module_path: services:media-service

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-app
            app_path: frontend/web-app
            api_url: https://api.sizbiz.uz
          - service: admin-app
            app_path: frontend/admin-app
            api_url: https://api.sizbiz.uz
          - service: partner
            app_path: frontend/partner
            api_url: https://api.sizbiz.uz

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            APP_PATH=${{ matrix.app_path }}
            VITE_API_URL=${{ matrix.api_url }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  notify:
    name: Telegram notify (build)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()

    steps:
      - name: Checkout (for commit subject)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured, skipping"
            exit 0
          fi

          if [ "${{ needs.build-backend.result }}" = "success" ] && [ "${{ needs.build-frontend.result }}" = "success" ]; then
            EMOJI="✅"; STATUS="образы собраны и запушены в GHCR (:latest + :sha)"
          else
            EMOJI="❌"; STATUS="ошибка сборки образов"
          fi

          SHA_SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          MSG="$(git log -1 --pretty=%s 2>/dev/null || echo '')"
          WHEN="$(date -u '+%Y-%m-%d %H:%M UTC')"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="$(printf '%s Сборка topdim — %s\n\n📦 %s — %s\n👤 %s · ветка %s\n🕐 %s\n\n🔗 %s' \
            "$EMOJI" "$STATUS" "$SHA_SHORT" "$MSG" "${{ github.actor }}" "${{ github.ref_name }}" "$WHEN" "$RUN_URL")"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d disable_web_page_preview=true || true
