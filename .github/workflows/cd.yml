name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-backend:
    name: Build backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: discovery-server
            module_path: infrastructure:discovery-server
          - service: config-server
            module_path: infrastructure:config-server
          - service: api-gateway
            module_path: infrastructure:api-gateway
          - service: identity-service
            module_path: services:identity-service
          - service: coupon-service
            module_path: services:coupon-service
          - service: order-service
            module_path: services:order-service
          - service: payment-service
            module_path: services:payment-service
          - service: bazaar-service
            module_path: services:bazaar-service
          - service: notification-service
            module_path: services:notification-service
          - service: media-service
            module_path: services:media-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/topdim/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/topdim/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            MODULE_PATH=${{ matrix.module_path }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: web-app
            app_path: frontend/web-app
          - service: admin-app
            app_path: frontend/admin-app
          - service: partner
            app_path: frontend/partner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/topdim/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/topdim/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            APP_PATH=${{ matrix.app_path }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-telegram-bot:
    name: Build telegram-bot
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: telegram-bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/topdim/telegram-bot:latest
            ghcr.io/${{ github.repository_owner }}/topdim/telegram-bot:sha-${{ github.sha }}
          cache-from: type=gha,scope=telegram-bot
          cache-to: type=gha,mode=max,scope=telegram-bot

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend, build-telegram-bot ]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,OWNER
          script: |
            OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            REGISTRY="ghcr.io/${OWNER_LOWER}/topdim"

            echo "$GHCR_PAT" | docker login ghcr.io -u "$OWNER_LOWER" --password-stdin

            for svc in discovery-server config-server api-gateway \
                       identity-service coupon-service order-service \
                       payment-service bazaar-service notification-service media-service; do
              echo "Updating topdim_${svc}..."
              docker service update --image "${REGISTRY}/${svc}:latest" \
                "topdim_${svc}" --with-registry-auth \
                && echo "  OK: ${svc}" || echo "  SKIP: ${svc} (not found)"
            done

            for svc in web-app admin-app partner; do
              echo "Updating topdim_${svc}..."
              docker service update --image "${REGISTRY}/${svc}:latest" \
                "topdim_${svc}" --with-registry-auth \
                && echo "  OK: ${svc}" || echo "  SKIP: ${svc} (not found)"
            done

            echo "Updating telegram-bot..."
            docker service update --image "${REGISTRY}/telegram-bot:latest" \
              topdim_telegram-bot --with-registry-auth \
              && echo "  OK: telegram-bot" || echo "  SKIP: telegram-bot (not found)"

            docker logout ghcr.io
