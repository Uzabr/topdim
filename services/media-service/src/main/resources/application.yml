server:
  port: 8088

spring:
  application:
    name: media-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:topdim}
  secret-key: ${MINIO_SECRET_KEY:topdim_secret}
  bucket: ${MINIO_BUCKET:topdim-media}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    uz.topdim: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) [%thread] %logger{36} - %msg%n"
