server:
  port: 8088

spring:
  application:
    name: media-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

minio:
  url: http://localhost:9000
  access-key: topdim
  secret-key: topdim_secret
  bucket: topdim-media

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    uz.topdim: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) [%thread] %logger{36} - %msg%n"
