server:
  port: 8087

spring:
  application:
    name: notification-service
  rabbitmq:
    host: localhost
    port: 5672
    username: topdim
    password: topdim_secret
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
