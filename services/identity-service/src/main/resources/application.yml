server:
  port: 8081

spring:
  application:
    name: identity-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/topdim_identity?sslmode=disable
    username: ${DB_USERNAME:topdim}
    password: ${DB_PASSWORD:topdim_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:topdim}
    password: ${RABBITMQ_PASSWORD:topdim_secret}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

notification:
  email:
    enabled: true
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@sizbiz.uz}}

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-do-not-use-in-production-32chars}
  access-token-expiration: 900000    # 15 minutes
  refresh-token-expiration: 604800000 # 7 days

telegram:
  # Токен бота покупателей (@BotFather). Пусто → вход через Telegram отключён (verify() → 401).
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  # Макс. возраст auth_date из Login Widget (сек) — анти-replay.
  auth-max-age-seconds: 300

google:
  # OAuth 2.0 Web Client ID из Google Cloud Console. Пусто → вход через Google отключён (verify() → 401).
  client-id: ${GOOGLE_CLIENT_ID:}
  # JWKS-эндпоинт Google для проверки подписи ID-token (ротируемые RSA-ключи).
  jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}

eskiz:
  # Реальная отправка OTP через Eskiz.uz SMS. false → фолбэк LoggingSmsSender (лог-заглушка).
  enabled: ${ESKIZ_ENABLED:false}
  base-url: ${ESKIZ_BASE_URL:https://notify.eskiz.uz/api}
  email: ${ESKIZ_EMAIL:}
  password: ${ESKIZ_PASSWORD:}
  from: ${ESKIZ_FROM:4546}
  # Двойные кавычки обязательны: без них ":" перед "{code}" ломает YAML-парсинг (плоский скаляр
  # с ": " внутри воспринимается как вложенный mapping).
  template: "${ESKIZ_TEMPLATE:SizBiz tasdiqlash kodi: {code}}"
  # Явные HTTP-таймауты на вызовы к Eskiz — без них синхронный вызов может зависнуть на неопределённое
  # время и вместе с synchronized login() исчерпать пул потоков identity-service.
  connect-timeout-ms: ${ESKIZ_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${ESKIZ_READ_TIMEOUT_MS:10000}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    uz.topdim: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
