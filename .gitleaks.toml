# gitleaks config — extends the built-in ruleset, then allowlists known
# non-production matches (test fixtures, API doc examples) to cut noise.
# Real config (application.yml) and app/frontend source stay scanned.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documentation examples — not real production secrets"
paths = [
  '''.*Test\.java$''',          # unit/slice test fixtures (hardcoded test JWT secrets)
  '''.*Tests\.java$''',
  '''docs/API_CONTRACT\.md$''', # example tokens in API documentation
  '''test-map\.html$''',        # local 2GIS map sandbox
]
