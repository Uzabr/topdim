services:
  # ==================== Databases ====================
  postgres:
    image: postgres:16-alpine
    container_name: topdim-postgres
    environment:
      POSTGRES_USER: topdim
      POSTGRES_PASSWORD: topdim_secret
      POSTGRES_DB: topdim_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topdim"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Cache ====================
  redis:
    image: redis:7-alpine
    container_name: topdim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Messaging ====================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: topdim-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: topdim
      RABBITMQ_DEFAULT_PASS: topdim_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== Object Storage ====================
  minio:
    image: minio/minio:latest
    container_name: topdim-minio
    environment:
      MINIO_ROOT_USER: topdim
      MINIO_ROOT_PASSWORD: topdim_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
