server {
    listen 80;
    server_name _;

    # N-L2: не раскрывать версию nginx в заголовке Server
    server_tokens off;

    # N-M1: security-заголовки (наследуются в location без своих add_header — т.е. на HTML и /api)
    # CSP намеренно НЕ добавлен здесь: строгий script-src/connect-src сломает 2GIS-карту.
    # CSP нужно прорабатывать отдельно с доменами 2GIS (см. SECURITY_HARDENING.md N-M1).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://topdim_api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
