# PostgreSQL Production Configuration
# Optimized for 5M+ users, 16GB RAM server, SSD storage
# Mount this file in docker-compose: -v ./docker/postgresql.conf:/etc/postgresql/postgresql.conf

# ==================== Memory ====================
shared_buffers = 4GB                    # 25% of total RAM
effective_cache_size = 12GB             # 75% of total RAM
work_mem = 64MB                         # Per-operation memory (sorts, joins)
maintenance_work_mem = 512MB            # For VACUUM, CREATE INDEX
wal_buffers = 64MB                      # WAL write buffer

# ==================== Connections ====================
listen_addresses = '*'
max_connections = 200                   # Total connections (all services)
superuser_reserved_connections = 3      # Reserved for admin

# ==================== Disk / SSD ====================
random_page_cost = 1.1                  # SSD optimized (default 4.0 for HDD)
effective_io_concurrency = 200          # SSD parallel reads
seq_page_cost = 1.0                     # Sequential scan cost

# ==================== WAL / Replication ====================
wal_level = replica                     # Enable streaming replication
max_wal_senders = 5                     # Max replication connections
max_replication_slots = 5               # Replication slots
wal_keep_size = 1GB                     # WAL retention for replicas
synchronous_commit = off                # Async commit (higher throughput)
checkpoint_completion_target = 0.9      # Spread checkpoint writes
max_wal_size = 2GB                      # Before forced checkpoint
min_wal_size = 1GB                      # Minimum WAL retention

# ==================== Query Planner ====================
default_statistics_target = 200         # More accurate query planning
enable_partitionwise_join = on          # Optimize partitioned table joins
enable_partitionwise_aggregate = on     # Optimize partitioned aggregations
jit = on                               # JIT compilation for complex queries

# ==================== Autovacuum ====================
autovacuum = on
autovacuum_max_workers = 4              # Parallel vacuum workers
autovacuum_naptime = 30s                # Check every 30s
autovacuum_vacuum_threshold = 50        # Rows changed before vacuum
autovacuum_vacuum_scale_factor = 0.05   # 5% of table (default 20%)
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.02  # 2% of table

# ==================== Logging ====================
log_min_duration_statement = 200        # Log queries >200ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                      # Log all temp file usage
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '

# ==================== Locale ====================
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
